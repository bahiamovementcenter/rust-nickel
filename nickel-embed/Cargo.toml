[package]
name = "nickel-embed"
version = "0.1.0"
description = "Embed the Nickel configuration language in Rust programs"
keywords = ["configuration", "language", "nickel"]
readme = "../README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The Nickel formatter (Topiary and tree-sitter): heavy, so off by default.
format = ["nickel-lang-core/format"]
# Documentation extraction, as JSON or Markdown.
doc = ["nickel-lang-core/doc"]
# Package manifests (`Nickel-pkg.ncl`): version resolution and fetching with gix. Without it,
# `PackageMap` still works with directories you provide.
packages = ["dep:nickel-lang-package", "dep:gix"]
# xD's Nickel primitives as a pinned Nickel package, with typed render/parse wrappers
# (`nickel_embed::xd`). Fetches it over HTTPS on first use.
xd = ["packages", "dep:nickel-lang-git"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
# nickel-lang-core breaks its API between minor releases, so it is pinned
# exactly and bumped deliberately.
nickel-lang-core = { version = "=0.19.0", default-features = false }
nickel-lang-vector = "0.2"
# Released in lockstep with nickel-lang-core, so pinned to the matching version.
nickel-lang-package = { version = "=0.8.0", optional = true }
nickel-lang-git = { version = "=0.3.0", optional = true }
# Only to turn on an HTTPS transport for nickel-lang-package's git fetches: without one, git
# dependencies over https fail with "'https' is not compiled in".
gix = { version = "0.84", optional = true, default-features = false, features = ["blocking-http-transport-reqwest-rust-tls"] }
codespan-reporting = { version = "0.13", features = ["serialization"] }
indexmap = "2.8"
malachite = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
