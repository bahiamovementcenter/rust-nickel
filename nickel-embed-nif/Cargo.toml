[package]
name = "nickel-embed-nif"
version = "0.1.0"
description = "Erlang NIF over nickel-embed: the in-process backend of gleam-nickel"
keywords = ["configuration", "nickel", "erlang", "gleam", "nif"]
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
# The library only works loaded into the Erlang VM; it is tested from Erlang (test/).
test = false
doctest = false

[dependencies]
nickel-embed = { path = "../nickel-embed" }
rustler = { version = "0.39", default-features = false, features = ["big_integer", "derive", "nif_version_2_16"] }
